<!doctype html><html lang="ja"><head><script async src="https://www.googletagmanager.com/gtag/js?id=G-09QZRMTLVK"></script><script src="ga4.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="銀座ホステスがお客様に選ばれるためのLINE営業の基本を解説します。"><title>銀座ホステスのLINE営業｜CLUB ROUGE</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="index.html">CLUB ROUGE <span>RECRUIT</span></a><a class="nav-cta" href="https://line.me/ti/p/MGM9CfKDj5">LINE相談</a></header><section class="article-hero"><p class="eyebrow">LINE COMMUNICATION</p><h1>売り込みより先に、<br>覚えていることを伝える。</h1></section><main class="article"><h2>営業LINEの基本</h2><p>定型文を大量に送るのではなく、その日の会話や相手の予定を覚え、自然に次の連絡へつなげます。</p><div class="box"><strong>最初に身につける3つ</strong><p>当日のお礼、会話内容に触れる、次回連絡する理由を残す。この積み重ねが再来店につながります。</p></div><h2>自分に合う文章をつくる</h2><p>元気、丁寧、聞き上手など、自分の接客とLINEの雰囲気を揃えることが大切です。入店後は具体例を使って支援します。</p><a class="back" href="index.html">← 採用トップへ戻る</a></main></body></html>
