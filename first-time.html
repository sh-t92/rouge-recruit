<!doctype html><html lang="ja"><head><script async src="https://www.googletagmanager.com/gtag/js?id=G-09QZRMTLVK"></script><script src="ga4.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="銀座ホステス未経験の方へ。ルージュでの仕事の始め方とサポートをご案内します。"><title>銀座未経験の方へ｜CLUB ROUGE</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="index.html">CLUB ROUGE <span>RECRUIT</span></a></header><section class="article-hero"><p class="eyebrow">FOR BEGINNERS</p><h1>銀座が初めてでも、<br>一歩ずつ身につけられます。</h1></section><main class="article"><h2>お客様を持っていなくても大丈夫？</h2><p>最初からお客様を持っている必要はありません。まずはテーブルでの振る舞い、会話、連絡の取り方を覚え、最初の場内指名・本指名を目指します。</p><div class="box"><strong>ルージュが大切にする「0→1→3本」</strong><p>いきなり大きな売上を求めるのではなく、最初の一件をつくり、それを再現できる力を育てます。</p></div><h2>不安になりやすいこと</h2><p>ドレスやヘアメイク、お酒、接客、昼職との両立など、面接・相談時に一つずつ確認できます。分からないまま始める必要はありません。</p><a class="back" href="index.html">← 採用トップへ戻る</a></main></body></html>
