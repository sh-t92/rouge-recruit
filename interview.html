<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="銀座クラブの面接が不安な方へ。ルージュが面接で大切にしていることをご紹介します。"><title>面接について｜CLUB ROUGE</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="index.html">CLUB ROUGE <span>RECRUIT</span></a></header><section class="article-hero"><p class="eyebrow">INTERVIEW</p><h1>条件の確認だけでなく、<br>可能性を見つける面接へ。</h1></section><main class="article"><h2>面接で見ていること</h2><p>外見だけではなく、愛嬌、受け答え、素直さ、継続力、接客への向き合い方などを総合的に確認します。</p><div class="box"><strong>話しておきたいこと</strong><p>夜職経験、希望勤務、目標収入、得意・苦手なこと、働くうえで不安なこと。</p></div><h2>背伸びした回答は不要です</h2><p>現在地を正直に共有していただく方が、入店後のミスマッチを防ぎ、適切なサポートにつながります。</p><a class="back" href="index.html">← 採用トップへ戻る</a></main></body></html>
