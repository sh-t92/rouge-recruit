<!doctype html><html lang="ja"><head><script async src="https://www.googletagmanager.com/gtag/js?id=G-09QZRMTLVK"></script><script src="ga4.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="お酒が苦手・飲めない方が銀座クラブで働く際に大切なことをご案内します。"><title>お酒が飲めなくても働ける？｜CLUB ROUGE</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="index.html">CLUB ROUGE <span>RECRUIT</span></a><a class="nav-cta" href="https://line.me/ti/p/MGM9CfKDj5">LINE相談</a></header><section class="article-hero"><p class="eyebrow">NON-DRINKER</p><h1>大切なのは酒量より、<br>心地よい時間をつくる力。</h1></section><main class="article"><h2>飲酒だけが接客ではありません</h2><p>会話、気配り、聞く力、テーブルでの連携など、お客様に楽しんでいただく方法は一つではありません。</p><div class="box"><strong>体質や事情は面接時に共有してください</strong><p>無理をして始めると長く続きません。飲める量や体質を正直に伝え、働き方を相談することが大切です。</p></div><h2>ノンアルコールでの対応</h2><p>状況に応じた飲み方や周囲との連携を覚えることで、自分を守りながら接客する力を身につけます。</p><a class="back" href="index.html">← 採用トップへ戻る</a></main></body></html>
