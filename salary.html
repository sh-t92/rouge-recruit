<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="銀座ホステスの時給・給料について。クラブRougeの時給、収入を伸ばす考え方をご案内します。"><title>銀座ホステスの時給・給料｜CLUB ROUGE</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="index.html">CLUB ROUGE <span>RECRUIT</span></a><a class="nav-cta" href="https://line.me/ti/p/MGM9CfKDj5">LINE相談</a></header><section class="article-hero"><p class="eyebrow">SALARY GUIDE</p><h1>時給だけでなく、<br>選ばれる力を収入へ。</h1></section><main class="article"><h2>ルージュの時給</h2><p>時給6,000円から。経験・実績・勤務条件により、時給10,000円以上も可能です。面接時に前店の給与や売上、希望勤務を確認します。</p><div class="box"><strong>収入を伸ばす基本</strong><p>出勤数だけでなく、再来店、本指名、同伴につながる関係づくりが大切です。ルージュでは「0本→1本→3本」と段階を分けて支援します。</p></div><h2>条件は個別に確認します</h2><p>見た目や経験だけでなく、愛嬌、継続力、接客への向き合い方、将来性を含めて総合的に判断します。</p><a class="back" href="index.html">← 採用トップへ戻る</a></main></body></html>
