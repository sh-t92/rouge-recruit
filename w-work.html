<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="昼職と銀座ホステスを両立したい方へ。Wワークで始める際の考え方をご案内します。"><title>Wワークで働きたい方へ｜CLUB ROUGE</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="index.html">CLUB ROUGE <span>RECRUIT</span></a></header><section class="article-hero"><p class="eyebrow">W WORK</p><h1>昼の仕事を大切にしながら、<br>銀座で新しい可能性を。</h1></section><main class="article"><h2>両立の鍵は、無理のない設計</h2><p>勤務可能な曜日・時間、昼職の繁忙期、目標収入を整理し、続けられる働き方を考えることが大切です。</p><div class="box"><strong>相談時に確認すること</strong><p>希望出勤日数、移動時間、翌朝の予定、夜の仕事で身につけたいことを伺います。</p></div><h2>限られた出勤を成果につなげる</h2><p>出勤数だけではなく、来店後の連絡や次回約束など、勤務外を含めた小さな積み重ねが重要です。</p><a class="back" href="index.html">← 採用トップへ戻る</a></main></body></html>
